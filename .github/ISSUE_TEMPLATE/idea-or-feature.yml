name: Idea or feature proposal
description: Propose a problem, research direction, or feature for Fellows
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should Fellows solve?
      placeholder: Describe the user or engineering problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How might we address it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and prior work
      description: What existing approaches or projects are relevant?
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and trade-offs
      description: Consider complexity, reliability, privacy, and cost.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Add papers, repositories, experiments, or examples.
